<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple Touch Icon - Rounded corners handled by iOS -->
  <!-- Background -->
  <rect width="180" height="180" fill="#2D5016"/>
  
  <!-- Inner Circle -->
  <circle cx="90" cy="90" r="75" fill="#FFFFFF"/>
  
  <!-- Herb Design - Scaled for smaller size -->
  <!-- Main stem -->
  <path d="M90 50 L90 130" stroke="#2D5016" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left leaves -->
  <path d="M90 70 Q65 62 58 80 Q63 90 90 85" fill="#4A7C2C"/>
  <path d="M90 100 Q68 95 62 110 Q68 118 90 113" fill="#4A7C2C"/>
  
  <!-- Right leaves -->
  <path d="M90 70 Q115 62 122 80 Q117 90 90 85" fill="#5A9C3C"/>
  <path d="M90 100 Q112 95 118 110 Q112 118 90 113" fill="#5A9C3C"/>
  
  <!-- Top leaf -->
  <path d="M90 50 Q78 42 73 58 Q80 68 90 62 Q100 68 107 58 Q102 42 90 50" fill="#6AB04C"/>
  
  <!-- Gold accents -->
  <circle cx="65" cy="77" r="4" fill="#D4AF37"/>
  <circle cx="115" cy="77" r="4" fill="#D4AF37"/>
  <circle cx="68" cy="105" r="4" fill="#D4AF37"/>
  <circle cx="112" cy="105" r="4" fill="#D4AF37"/>
</svg>
